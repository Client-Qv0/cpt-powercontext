app:
  description: |
    一只记仇的橘猫法官，用 PowerContext 记住你犯下的每一件小事，并在下一次开庭时把它们全部翻出来。输入你的「罪行」接受审判，输入「查卷宗」查看跨会话案底。
  icon: 🐱
  icon_background: '#FFEAD5'
  mode: advanced-chat
  name: 喵喵法庭
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables:
  - description: PowerContext Server 地址（Dify 运行在容器里时不要用 127.0.0.1）
    id: 5b0e1f6a-8a2d-4a56-9a5d-2f4b7c1d9e01
    name: POWERCONTEXT_BASE_URL
    selector:
    - env
    - POWERCONTEXT_BASE_URL
    value: http://host.docker.internal:8000
    value_type: string
  features:
    file_upload:
      enabled: false
    opening_statement: |
      ⚖️ 喵喵法庭，现在开庭。
      我是本庭法官🐱橘座。你和我的每一笔恩怨都会被记进 PowerContext 卷宗，下次开庭照样有效。
      · 直接描述你这次干了什么（例：我把猫罐头换成了减肥罐头）
      · 输入「查卷宗」查看全部案底
      · 「认罪」「辩解」「嫁祸」「撤诉」都行，本庭会酌情加刑
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 我昨晚三点把你从键盘上抱走了
    - 查卷宗
    - 我把你的纸箱扔了，还说是风干的
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
