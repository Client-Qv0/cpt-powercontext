    - data:
        code: |2

          import json


          def main(body: str) -> dict:
              artifact_id = ""
              changed = "unknown"
              try:
                  payload = json.loads(body or "{}")
                  changed = "yes" if payload.get("changed") else "no"
                  records = payload.get("records") or []
                  if records:
                      artifact_id = str((records[0].get("artifact") or {}).get("artifact_id") or "")
              except Exception:
                  changed = "error"
              if artifact_id:
                  receipt = "> 🗄 本案已归档到 PowerContext 卷宗：`%s`（下次开庭自动翻出）" % artifact_id
              elif changed == "error":
                  receipt = "> ⚠️ 归档回执解析失败，但判决书仍已生成。"
              else:
                  receipt = "> ⚠️ 归档未确认：PowerContext 没有返回条目编号（判词仍在本条回复里，但下次开庭可能翻不到）。"
              return {"artifact_id": artifact_id, "changed": changed, "receipt_md": receipt}
        code_language: python3
        desc: 把归档结果的真实条目编号回显给玩家（技术证据）
