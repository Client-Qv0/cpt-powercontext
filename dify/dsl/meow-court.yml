    - data:
        code: |2

          import json
          import re


          def parse_verdict(raw: str) -> dict:
              text = (raw or "").strip()
              fenced = re.search(r"```(?:json)?\s*(\{.*?\})\s*```", text, re.S)
              candidate = fenced.group(1) if fenced else text
              left, right = candidate.find("{"), candidate.rfind("}")
              if left >= 0 and right > left:
                  candidate = candidate[left:right + 1]
              try:
                  payload = json.loads(candidate)
                  if isinstance(payload, dict):
                      return payload
              except Exception:
                  pass
              return {}


          def text_field(payload: dict, key: str, fallback: str) -> str:
              value = payload.get(key)
              if isinstance(value, str) and value.strip():
                  return value.strip()
              if value is not None:
                  return str(value).strip() or fallback
              return fallback


          def main(raw: str, hearing_no: float, stars: str, prior_count: float,
                   case_text: str, scope_id: str) -> dict:
              payload = parse_verdict(raw)
              if payload:
                  charge = text_field(payload, "charge", "未定罪名")
                  plea = text_field(payload, "plea", "态度不明")
                  verdict = text_field(payload, "verdict", "本庭今天不想说话。")
                  penalty = text_field(payload, "penalty", "罚猫粮一罐")
                  clause = text_field(payload, "clause", "本庭保留追加判决的权利")
                  precedent = text_field(payload, "precedent", "无")
                  gavel = text_field(payload, "gavel", "退庭。")
              else:
                  # 模型没按 JSON 输出时降级：原文当判词，仍然完成归档
                  charge = "未定罪名"
                  plea = "态度不明（判词格式异常）"
                  verdict = " ".join((raw or "").split())[:600] or "本庭今天不想说话。"
                  penalty = "罚猫粮一罐"
                  clause = "下次开庭请按格式说话"
                  precedent = "无"
                  gavel = "退庭。"

              summary = " ".join(case_text.split())[:180]
              memory_text = (
                  "第%d号 · 累犯%s · 被告自述：%s | 案由：%s | 判读：%s | 判决：%s | 刑罚：%s | 附加条款：%s | 援引旧案：%s"
                  % (int(hearing_no), stars, summary, charge, plea, verdict, penalty, clause, precedent)
              )[:1500]

              answer_md = "\n".join(
                  [
                      "## ⚖️ 第 %d 号 · 喵喵法庭开庭" % int(hearing_no),
                      "",
                      "**累犯等级**：%s（前科 %d 次）" % (stars, int(prior_count)),
                      "**案由**：%s" % charge,
                      "**被告态度**：%s" % plea,
                      "",
                      "**判词**：",
                      "> %s" % verdict,
                      "",
                      "**刑罚**：%s" % penalty,
                      "**附加条款**：%s" % clause,
                      "**援引旧案**：%s" % precedent,
                      "",
                      "—— %s" % gavel,
                  ]
              )

              archive_body = json.dumps(
                  {
                      "scope_id": scope_id,
                      "kind": "meow-court/case",
                      "text": memory_text,
                      "reason": "喵喵法庭自动归档（第%d号）" % int(hearing_no),
                  },
                  ensure_ascii=False,
              )

              return {
                  "memory_text": memory_text,
                  "answer_md": answer_md,
                  "charge": charge,
                  "parsed": "yes" if payload else "no",
                  "archive_body": archive_body,
              }
        code_language: python3
        desc: 解析判词 JSON；解析失败时降级但仍完成归档；组装归档请求体
